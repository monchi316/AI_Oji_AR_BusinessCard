<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AIおじ AR名刺</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="intro" class="intro">
      <div class="intro__panel">
        <img src="./assets/business-card.png" alt="AIおじ 名刺" />
        <h1>AIおじ AR名刺</h1>
        <p>開始後、カメラで名刺を映すと動画が名刺の上に重なります。</p>
        <button id="startButton" type="button" disabled>読み込み中</button>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite">読み込み中...</div>

    <a-scene
      id="arScene"
      mindar-image="imageTargetSrc: ./targets/business-card.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
      color-space="sRGB"
      renderer="alpha: true; antialias: true; colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
      background="transparent: true"
    >
      <a-assets>
        <video
          id="cardVideo"
          src="./assets/business-card-video.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane"
          src="#cardVideo"
          width="1"
          height="0.6047"
          position="0 0.028 0.001"
          rotation="0 0 0"
          visible="false"
        ></a-video>
      </a-entity>
    </a-scene>

    <script src="./main.js"></script>
  </body>
</html>
